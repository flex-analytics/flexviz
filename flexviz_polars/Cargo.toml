[package]
name = "flexviz-polars"
version = "0.1.0"
edition = "2021"

[lib]
name = "flexviz_polars"
crate-type = ["cdylib"]
bench = false

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
pyo3-polars = { version = "0.28.0", features = ["derive", "dtype-struct", "dtype-array"] }
serde = { version = "1", features = ["derive"] }
polars = { version = "0.55.1", default-features = false, features = ["dtype-f16", "dtype-struct", "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16"] }
polars-arrow = { version = "0.55.1", default-features = false }
argminmax = { version = "0.6", default-features = false, features = ["float", "half", "nightly_simd"] }
half = { version = "2.7", default-features = false }
# Kernel-internal parallelism. A cdylib plugin statically links its own
# polars-core, so the host's pool cannot be joined (pola-rs/polars#19650); the
# kernels run on a dedicated pool sized from POLARS_MAX_THREADS instead — see
# kernel_pool() in src/expressions.rs and benchmarks/results/hist-parallel-*.md.
rayon = "1.12"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench_argminmax"
harness = false
