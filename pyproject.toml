[project]
name = "flexviz"
version = "0.1.0b2"
description = "Interactive cross-filter dashboards on 100M+ rows, in pure Python — Polars-native"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Jeroen Van der Donckt" },
    { name = "Jonas Van der Donckt" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "polars[timezone]>=1.44.1",
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "requests>=2.32.5",
    "numpy>=1.24",
    "pydantic>=2",
    "flexviz-polars>=0.1.0b1,<0.2",
]

[project.scripts]
flexviz = "flexviz.cli:main"

[project.urls]
Homepage = "https://flexviz.tech"
Documentation = "https://docs.flexviz.tech"
Repository = "https://github.com/flex-analytics/flexviz"
Issues = "https://github.com/flex-analytics/flexviz/issues"
Changelog = "https://github.com/flex-analytics/flexviz/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff>=0.15.5",
    "black>=26.3.0",
    "numpy>=2.2.6",
    "pytest>=9.0.2",
    "httpx>=0.28.0",
    "playwright>=1.58.0",
    "pytest-playwright>=0.7.2",
    "pytest-xdist>=3.8.0",
    "maturin>=1.12.6",
    "pytest-benchmark>=5.2.3",
    "pytest-randomly>=4.0.1",
    # polars_lf_from() accepts PyArrow tables; tests exercise that path.
    "pyarrow>=22.0.0",
]
# Standalone group: docs builds run without the project installed (mkdocstrings
# reads the source statically), so docs CI needs no Rust toolchain.
docs = [
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.30",
    # Material is incompatible with the announced MkDocs 2.0 rewrite; keep the
    # resolver on the 1.x line until the ecosystem settles.
    "mkdocs>=1.6,<2",
]

[tool.black]
target-version = ["py310"]

[tool.uv.sources]
flexviz-polars = { path = "flexviz_polars", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not benchmark'"
markers = [
    "integration: tests that spin up a FastAPI TestClient",
    "slow: benchmarks and large-dataset tests",
    "browser: browser-based tests that require Playwright (run with make test-browser)",
    "benchmark: performance benchmarks (reserved for the future benchmark suite)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# An allowlist, not an exclude list: anything new at the repo root stays out of
# the sdist unless it is named here
[tool.hatch.build.targets.sdist]
# Leading slashes anchor to the repo root. Without them these are
# gitignore-style patterns that match at any depth, which pulls
# flexviz_polars/{README.md,pyproject.toml,tests} in as well.
include = [
    "/flexviz",
    "/tests",
    "/Architecture.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/SECURITY.md",
    "/pyproject.toml",
]
