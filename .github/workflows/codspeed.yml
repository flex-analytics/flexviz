# Walltime only: instruction simulation ignores syscall time and is not
# deterministic for multithreaded Polars. The wheel is built on a GitHub runner,
# because the macro runner's monthly minutes are the scarce resource.
name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - docs/**
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # public repo: the upload authenticates with OIDC, not a token

# Same grouping as ci.yml: cancel superseded PR runs, never cancel a main run.
concurrency:
  group: codspeed-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  plugin:
    # 22.04, not 24.04: the macro runner is Ubuntu 22.04, and a wheel built
    # against a newer glibc gets a manylinux tag it cannot install.
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: flexviz_polars

      - name: Install build tooling
        run: uv sync --locked --no-install-package flexviz-polars

      # Release, unlike ci.yml: the debug kernel is several times slower, so its
      # numbers say nothing about the shipped wheel.
      - name: Build the release plugin wheel
        run: uv run --no-sync maturin build --release --features nightly -m flexviz_polars/Cargo.toml -o dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-arm64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  benchmarks:
    needs: plugin
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    timeout-minutes: 20
    env:
      # Pin the thread count, for the same reason as tests/test_ooc.py: a
      # measurement that scales with the runner's core count is not comparable.
      POLARS_MAX_THREADS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-arm64
          path: dist

      - name: Install project without the plugin
        run: uv sync --locked --no-install-package flexviz-polars

      - name: Install the built plugin wheel
        run: VIRTUAL_ENV=.venv uv pip install dist/*.whl

      # The size check catches a debug wheel: the debug .so is ~28 MB, the
      # release one is stripped and far smaller.
      - name: Verify the release plugin is importable
        run: uv run --no-sync python -c "import os; from flexviz_polars import _internal; size = os.path.getsize(_internal.__file__); print(_internal.__file__, size); assert size < 20_000_000, 'debug build'"

      - uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: walltime
          run: uv run --no-sync pytest benchmarks --codspeed -p no:randomly
