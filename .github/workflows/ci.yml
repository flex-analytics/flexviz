name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Skipping the plugin keeps this job off the Rust critical path: it needs
      # black/ruff, not a compiled kernel.
      - name: Install Python tooling
        run: uv sync --locked --no-install-package flexviz-polars

      - name: black
        run: uv run --no-sync black --check flexviz tests

      - name: ruff
        run: uv run --no-sync ruff check flexviz tests

      # rustfmt.toml uses group_imports/imports_granularity, which are
      # nightly-only. rustup installs the toolchain pinned in
      # rust-toolchain.toml automatically.
      - name: cargo fmt
        run: cargo fmt --manifest-path flexviz_polars/Cargo.toml --check

  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: flexviz_polars

      # maturin comes from the locked dev group, so CI and `make build-plugin`
      # use the same version. --no-install-package avoids the circular build:
      # syncing the plugin would compile the very thing we are about to build.
      - name: Install build tooling
        run: uv sync --locked --no-install-package flexviz-polars

      # Debug, not release: it is what `make build-plugin` produces locally, it
      # compiles faster, and its overflow checks are worth having in CI.
      # release.yml builds and tests the release artifact.
      - name: Build plugin wheel
        run: uv run --no-sync maturin build -m flexviz_polars/Cargo.toml -o dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  test:
    needs: plugin
    strategy:
      fail-fast: false
      matrix:
        # One abi3 wheel per OS covers every Python, so the full version sweep
        # costs three compiles, not twenty-one. macOS and Windows carry one
        # version each, to catch path and process bugs rather than syntax ones.
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-${{ matrix.os }}
          path: dist

      - name: Install project without the plugin
        run: uv sync --locked --python ${{ matrix.python }} --no-install-package flexviz-polars

      - name: Install the built plugin wheel
        run: VIRTUAL_ENV=.venv uv pip install dist/*.whl

      # Without this, a failed wheel install is not an ImportError: the crate
      # directory on sys.path resolves `flexviz_polars` to an empty PEP 420
      # namespace package, and the suite fails later with a confusing
      # AttributeError instead.
      - name: Verify the real plugin is importable
        run: uv run --no-sync python -c "from flexviz_polars import _internal; print(_internal.__file__)"

      - name: Tests
        run: uv run --no-sync pytest tests flexviz_polars/tests -q

  browser:
    needs: plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-ubuntu-latest
          path: dist

      - name: Install project without the plugin
        run: uv sync --locked --no-install-package flexviz-polars

      - name: Install the built plugin wheel
        run: VIRTUAL_ENV=.venv uv pip install dist/*.whl

      - name: Install Chromium
        run: uv run --no-sync playwright install --with-deps chromium

      # Mirrors `make test-browser`. pytest-randomly is disabled because the
      # browser suite depends on module-scoped server fixtures.
      - name: Browser tests
        run: uv run --no-sync pytest -m browser -p no:randomly --override-ini="addopts=" -n 6
